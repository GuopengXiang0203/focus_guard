workflows:
  ios-workflow:
    name: iOS Build & Publish
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Find project and get dependencies
        script: |
          PUBSPEC=$(find /Users/builder -name "pubspec.yaml" -type f 2>/dev/null | head -1)
          if [ -n "$PUBSPEC" ]; then
            PROJECT_DIR=$(dirname "$PUBSPEC")
            cd "$PROJECT_DIR"
            echo "Project dir: $PROJECT_DIR"
            flutter pub get
          else
            echo "ERROR: Could not find pubspec.yaml"
            exit 1
          fi
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.focus.focus_guard" --type IOS_APP_STORE
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS for App Store
        script: |
          PUBSPEC=$(find /Users/builder -name "pubspec.yaml" -type f 2>/dev/null | head -1)
          PROJECT_DIR=$(dirname "$PUBSPEC")
          cd "$PROJECT_DIR"
          flutter build ipa --release --export-options-plist=/Users/builder/clone/ios/Runner.xcodeproj/ExportOptions.plist
      - name: List build output
        script: |
          find /Users/builder -name "*.ipa" -type f 2>/dev/null
    artifacts:
      - /Users/builder/**/build/ios/ipa/*.ipa
      - /Users/builder/**/*.ipa
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
